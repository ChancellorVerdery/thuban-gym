name: ThubanGym
options:
  bundleIdPrefix: org.thuban
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanGymCore:
    path: Packages/ThubanGymCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanGym:
    type: application
    platform: macOS
    sources:
      - path: ThubanGym/App
      - path: ThubanGym/Views
      - path: ThubanGym/Resources/Assets.xcassets
    dependencies:
      - package: ThubanGymCore
    info:
      path: ThubanGym/Resources/Info.plist
      properties:
        CFBundleName: Thuban Gym
        CFBundleDisplayName: Thuban Gym
        CFBundleIdentifier: org.thuban.gym
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: ThubanGym/Resources/ThubanGym.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thuban.gym
        PRODUCT_NAME: Thuban Gym
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
