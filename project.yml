name: ThubanGym
options:
  bundleIdPrefix: org.thuban
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanGymCore:
    path: Packages/ThubanGymCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanGym:
    type: application
    platform: macOS
    sources:
      - path: ThubanGym/App
      - path: ThubanGym/Views
      - path: Shared
      - path: ThubanGym/Resources/Assets.xcassets
    dependencies:
      - package: ThubanGymCore
    # Signing, entitlements (with / without iCloud) and the team: Config/Mac.xcconfig (+ gitignored Signing.xcconfig).
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    info:
      path: ThubanGym/Resources/Info.plist
      properties:
        CFBundleName: Thuban Gym
        CFBundleDisplayName: Thuban Gym
        CFBundleIdentifier: org.thuban.gym
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # iCloud Sync: ThubanICloud is YES only in a build signed with a team and the iCloud entitlements
        # (Config/*.xcconfig); the container holds Documents/gym.json and is hidden from iCloud Drive / Files.
        ThubanICloud: "$(THUBAN_SIGNED)"
        NSUbiquitousContainers:
          iCloud.org.thuban.gym:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Thuban Gym
            NSUbiquitousContainerSupportedFolderLevels: None
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thuban.gym
        PRODUCT_NAME: Thuban Gym
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
  GymiOS:
    type: application
    platform: iOS
    sources:
      - path: GymiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
      - path: Shared
    dependencies:
      - package: ThubanGymCore
      - sdk: Charts.framework
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: GymiOS/Resources/Info.plist
      properties:
        CFBundleName: Thuban Gym
        CFBundleDisplayName: Thuban Gym
        CFBundleIdentifier: org.thuban.gym.ios
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIDesignRequiresCompatibility: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: false
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        # iCloud Sync: ThubanICloud is YES only in a build signed with a team and the iCloud entitlements
        # (Config/*.xcconfig); the container holds Documents/gym.json and is hidden from iCloud Drive / Files.
        ThubanICloud: "$(THUBAN_SIGNED)"
        NSUbiquitousContainers:
          iCloud.org.thuban.gym:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Thuban Gym
            NSUbiquitousContainerSupportedFolderLevels: None
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thuban.gym.ios
        PRODUCT_NAME: Thuban Gym
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
        ENABLE_PREVIEWS: false
